# 1-hive route table (hive-route, ROUTING.md). Workers on Claude Code (Claude Pro plan),
# reviewers on Codex (ChatGPT plan). No API keys and no local model yet, so every pool is a
# subscription and the gateway is not used (direct mode, §8). tools/launch-task.sh asks the
# router for every attempt; the log starts in `fixed` mode, which reproduces the launcher
# before routing: the baseline to measure against (§6).
format: hive-route.table/1
version: 1
prefer: headroom
pools:
  claude-plan:  {kind: subscription, limits: [{window: 5h}, {window: 7d}]}
  chatgpt-plan: {kind: subscription, limits: [{window: 5h}, {window: 7d}]}
routes:
  opus-plan:    {tier: strong,   pool: claude-plan,  family: claude, harness: claude-code, model: claude-opus-5-5, tools: true}
  sonnet-plan:  {tier: standard, pool: claude-plan,  family: claude, harness: claude-code, model: claude-sonnet-5-5, tools: true}
  gpt-sol-plan: {tier: strong,   pool: chatgpt-plan, family: gpt,    harness: codex, model: gpt-5.6-sol, effort: medium, tools: true}
tiers:
  strong:   [opus-plan, gpt-sol-plan]
  standard: [sonnet-plan]
fixed:
  work: opus-plan
  review: gpt-sol-plan
